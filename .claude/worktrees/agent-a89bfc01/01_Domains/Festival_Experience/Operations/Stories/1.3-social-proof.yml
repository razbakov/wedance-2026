title: "See first names and dance styles of signed-up dancers"
story: 1.3
epic: Festival landing page
persona: Festival Dancer
release: MVP
estimate: 3

description: >
  As a Festival Dancer, I want to see first names and dance styles of
  signed-up dancers, so I can feel like real people are already involved.

factors:
  complexity: Medium
  uncertainty: Medium
  effort: Medium
  risk: Low
  dependencies: Low

rationale: >
  Needs a new tRPC procedure to list festival attendees (dancers who signed
  up for any activity). The dancers table exists but lacks dance style and
  city columns — schema migration needed. Also needs a UI section on the
  festival page to display attendee names/styles.
