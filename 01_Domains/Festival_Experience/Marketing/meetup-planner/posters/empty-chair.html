<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeDance — The Empty Chair</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Noto+Sans:wght@400&family=Poppins:wght@200;400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2245px;
    height: 3189px;
    background: #000000;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Subtle ambient glow at top */
  .ambient {
    position: absolute;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 1600px;
    height: 800px;
    background: radial-gradient(ellipse, rgba(241,2,61,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .logo {
    position: absolute;
    top: 80px;
    left: 100px;
    font-family: 'Lato', sans-serif;
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 1px;
    z-index: 10;
  }
  .logo .we { color: #F1023D; }
  .logo .dance { color: #FFFFFF; }

  /* ── TABLE SCENE ── */
  .table-scene {
    position: absolute;
    top: 280px;
    left: 50%;
    transform: translateX(-50%);
    width: 1800px;
    height: 1400px;
  }

  /* The table itself */
  .dinner-table {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1100px;
    height: 550px;
    background: linear-gradient(135deg, #3D2517 0%, #2C1810 40%, #1E0F09 100%);
    border-radius: 30px;
    border: 3px solid #4A2E1C;
    box-shadow:
      0 0 80px rgba(0,0,0,0.8),
      inset 0 0 60px rgba(0,0,0,0.3);
  }

  /* Table center decoration — a subtle runner */
  .table-runner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 900px;
    height: 4px;
    background: linear-gradient(90deg, transparent, rgba(212,168,67,0.15), rgba(212,168,67,0.25), rgba(212,168,67,0.15), transparent);
    border-radius: 2px;
  }

  /* Candle centerpieces */
  .candle {
    position: absolute;
    width: 16px;
    height: 16px;
    background: radial-gradient(circle, #FFD700 0%, #D4A843 40%, transparent 70%);
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(255,215,0,0.4), 0 0 60px rgba(212,168,67,0.2);
  }
  .candle-1 { top: 46%; left: 35%; }
  .candle-2 { top: 46%; left: 50%; }
  .candle-3 { top: 46%; left: 65%; }

  /* ── PLACE SETTINGS ── */
  .setting {
    position: absolute;
    width: 200px;
    height: 200px;
  }

  .plate {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.25);
    background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 100%);
  }
  .plate-inner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85px;
    height: 85px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.12);
  }

  /* Fork (left of plate) */
  .fork {
    position: absolute;
    top: 50%;
    left: 15px;
    transform: translateY(-50%);
    width: 6px;
    height: 80px;
    background: linear-gradient(180deg, rgba(200,200,200,0.5), rgba(200,200,200,0.25));
    border-radius: 3px;
  }
  .fork::before {
    content: '';
    position: absolute;
    top: -8px;
    left: -4px;
    width: 14px;
    height: 20px;
    border-radius: 3px 3px 0 0;
    border-top: 2px solid rgba(200,200,200,0.4);
    border-left: 2px solid rgba(200,200,200,0.4);
    border-right: 2px solid rgba(200,200,200,0.4);
  }

  /* Knife (right of plate) */
  .knife {
    position: absolute;
    top: 50%;
    right: 15px;
    transform: translateY(-50%);
    width: 5px;
    height: 80px;
    background: linear-gradient(180deg, rgba(220,220,220,0.5), rgba(220,220,220,0.25));
    border-radius: 2px;
  }
  .knife::before {
    content: '';
    position: absolute;
    top: -12px;
    left: -2px;
    width: 9px;
    height: 24px;
    border-radius: 4px 4px 0 0;
    background: linear-gradient(180deg, rgba(220,220,220,0.4), rgba(220,220,220,0.2));
  }

  /* Wine glass (above plate for top row, below for bottom row) */
  .glass {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: radial-gradient(circle, rgba(140,30,50,0.2) 0%, transparent 70%);
  }
  .glass-top { top: 5px; left: 50%; transform: translateX(-50%); }
  .glass-bottom { bottom: 5px; left: 50%; transform: translateX(-50%); }

  /* ── SEAT POSITIONS ── */
  /* Top row (3 seats) */
  .seat-t1 { top: 30px; left: 200px; }
  .seat-t2 { top: 10px; left: 50%; transform: translateX(-50%); }
  .seat-t3 { top: 30px; right: 200px; }

  /* Bottom row (3 seats) */
  .seat-b1 { bottom: 30px; left: 200px; }
  .seat-b2 { bottom: 10px; left: 50%; transform: translateX(-50%); }
  .seat-b3 { bottom: 30px; right: 200px; }

  /* ── OCCUPIED SEAT GLOW ── */
  .person {
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,168,67,0.35) 0%, rgba(212,168,67,0.08) 50%, transparent 70%);
    box-shadow: 0 0 50px rgba(212,168,67,0.2);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  /* Subtle silhouette in the glow */
  .person::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(212,168,67,0.25);
    box-shadow: 0 30px 0 0 rgba(212,168,67,0.15);
  }

  /* Person on bottom side — shift glow downward */
  .person-bottom {
    top: auto;
    bottom: -40px;
    left: 50%;
    transform: translateX(-50%);
  }
  .person-top {
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* ── THE EMPTY CHAIR — THE STAR ── */
  .empty-seat {
    position: absolute;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 3px dashed #F1023D;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow:
      0 0 40px rgba(241,2,61,0.4),
      0 0 80px rgba(241,2,61,0.2),
      0 0 120px rgba(241,2,61,0.1),
      inset 0 0 40px rgba(241,2,61,0.1);
    animation: pulse 2.5s ease-in-out infinite;
  }
  .empty-seat::after {
    content: '?';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Poppins', sans-serif;
    font-size: 48px;
    font-weight: 700;
    color: rgba(241,2,61,0.5);
  }

  @keyframes pulse {
    0%, 100% {
      box-shadow:
        0 0 40px rgba(241,2,61,0.4),
        0 0 80px rgba(241,2,61,0.2),
        0 0 120px rgba(241,2,61,0.1),
        inset 0 0 40px rgba(241,2,61,0.1);
    }
    50% {
      box-shadow:
        0 0 60px rgba(241,2,61,0.6),
        0 0 100px rgba(241,2,61,0.3),
        0 0 160px rgba(241,2,61,0.15),
        inset 0 0 60px rgba(241,2,61,0.15);
    }
  }

  /* Spotlight beam on empty chair */
  .spotlight {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 250px;
    height: 350px;
    background: radial-gradient(ellipse at center bottom, rgba(241,2,61,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── TEXT SECTION ── */
  .text-section {
    position: absolute;
    bottom: 280px;
    left: 0;
    right: 0;
    text-align: center;
    padding: 0 120px;
  }

  .headline {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 96px;
    color: #FFFFFF;
    line-height: 1.15;
    margin-bottom: 40px;
    letter-spacing: -1px;
  }

  .subheadline {
    font-family: 'Poppins', sans-serif;
    font-weight: 200;
    font-size: 38px;
    color: rgba(255,255,255,0.8);
    line-height: 1.5;
    margin-bottom: 50px;
  }

  .cta {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 42px;
    color: #F1023D;
    letter-spacing: 0.5px;
  }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 240px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 100px 60px;
  }

  .qr-container {
    width: 340px;
    height: 340px;
    position: absolute;
    right: 100px;
    bottom: 60px;
  }
  .qr-container img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .footer-text {
    font-family: 'Noto Sans', sans-serif;
    font-size: 26px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 4px;
    position: absolute;
    bottom: 70px;
    left: 100px;
  }
</style>
</head>
