title: "Pay EUR 1 via Stripe when free spots are full"
story: 2.3
epic: Dancer sign-up
persona: Festival Dancer
release: MVP
estimate: 2

description: >
  As a Festival Dancer, I want to pay EUR 1 via Stripe when free spots are full,
  so I can still join after the first 10 dancers.

factors:
  complexity: Low
  uncertainty: Medium
  effort: Low
  risk: Low
  dependencies: Medium

rationale: >
  For MVP this is a simple external Stripe Payment Link (pre-created in
  Stripe dashboard), not a full checkout integration. Code just needs a
  conditional redirect when spots are full. Uncertainty is in the Stripe
  account setup (external dependency), not the code.
