name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run test -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wedance
          POSTGRES_PASSWORD: wedance
          POSTGRES_DB: wedance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wedance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://wedance:wedance@localhost:5432/wedance_test
      NEON_FETCH_ENDPOINT: http://localhost:4444/sql
      LOCAL_PG_URL: postgresql://wedance:wedance@localhost:5432/wedance_test

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Apply schema to Postgres
        run: bunx drizzle-kit push --force

      - name: Start neon-http-proxy (background)
        run: bun scripts/dev/neon-http-proxy.ts &

      - name: Wait for neon-http-proxy
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:4444/sql -X POST -H 'Content-Type: application/json' \
              -d '{"query":"SELECT 1"}' && break
            sleep 1
          done

      - name: Seed test data
        run: bun run db:seed

      - name: Run integration tests (all vitest, 0 skips expected)
        run: bun run test -- --reporter=verbose --reporter=json --outputFile.json=test-results/vitest.json

      # One log line per test → Grafana Cloud Loki (RAZ-631). Never fails the
      # build: no secrets (fork PRs) or a Loki outage only print a warning.
      - name: Push test results to Grafana Loki
        if: always()
        run: bun scripts/ci/loki-test-results.ts --suite vitest --file test-results/vitest.json
        env:
          LOKI_URL: ${{ secrets.LOKI_URL }}
          LOKI_USER: ${{ secrets.LOKI_USER }}
          LOKI_TOKEN: ${{ secrets.LOKI_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # Required for merging to main (branch protection, ADR-013), so it runs on
  # every PR as well as after merge. ~4 min, in parallel with unit/integration.
  # The full BDD suite runs nightly (nightly.yml), same reusable workflow.
  e2e-smoke:
    uses: ./.github/workflows/e2e.yml
    with:
      grep: '@smoke'
      suite: playwright-smoke
    secrets: inherit
