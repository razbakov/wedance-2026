# Full BDD E2E suite — every scenario, not just @smoke (ADR-013).
# Not a merge gate: the @write scenarios set up their own fixtures and take
# longer, and a nightly failure points at the day's merges. A failed scheduled
# run emails whoever last changed this file's cron (GitHub default).
# Run it by hand (Actions → Nightly E2E → Run workflow) after changing e2e.yml.
name: Nightly E2E

on:
  schedule:
    - cron: '0 2 * * *' # 03:00 Europe/Berlin (CET), 04:00 in summer
  workflow_dispatch:

concurrency:
  group: nightly-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    uses: ./.github/workflows/e2e.yml
    with:
      grep: ''
      suite: playwright-full
    secrets: inherit
