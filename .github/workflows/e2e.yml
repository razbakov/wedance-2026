# End-to-end run against a CI build of the app with an ephemeral Postgres
# (never a preview — previews share the production database). Reusable:
#   test.yml    → `e2e-smoke`, grep @smoke, every PR + every push to main.
#                 Required by branch protection on main (ADR-013).
#   nightly.yml → full BDD suite (no grep), 03:00 Europe/Berlin.
# The required check is named "e2e-smoke / e2e" (caller job / this job).
name: E2E

on:
  workflow_call:
    inputs:
      grep:
        description: Playwright --grep filter (empty = the whole BDD suite)
        type: string
        default: ''
      suite:
        description: Name of the run in test-results/ and Grafana Loki
        type: string
        default: playwright-smoke

jobs:
  e2e:
    runs-on: ubuntu-latest
    # ~4 min typical for @smoke (DB + build + cached browser + tests). 25 min
    # absorbs occasional slow apt mirrors (observed 10min+ on westus3, run #442)
    # and the longer full suite.
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wedance
          POSTGRES_PASSWORD: wedance
          POSTGRES_DB: wedance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wedance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://wedance:wedance@localhost:5432/wedance_test
      BASE_URL: http://localhost:3000
      SITE_URL: http://localhost:3000
      # Force node preset so nuxt preview works (CI auto-detects Vercel otherwise)
      NITRO_PRESET: node-server
      # The neon-http-proxy bridges the @neondatabase/serverless driver to the
      # plain CI Postgres. The app reads NEON_FETCH_ENDPOINT at startup.
      NEON_FETCH_ENDPOINT: http://localhost:4444/sql
      LOCAL_PG_URL: postgresql://wedance:wedance@localhost:5432/wedance_test
      # FirebaseScrypt test keys — NOT production secrets. These are throwaway
      # values that let the auth router hash/verify passwords in CI. Real users
      # created in the test DB use these keys, so they only work in this run.
      FIREBASE_SALT_SEPARATOR: Bw==
      FIREBASE_SIGNER_KEY: jbxMAlxOb1EIkbUTmWJHJGCOhY6w7bouZxGqvsXFQwPq9lFjLSTMEJBkenAfMGbjLDpir0nnVDlyyXqU5Dv2eA==
      E2E_SUITE: ${{ inputs.suite }}

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Run database migrations
        run: bunx drizzle-kit push --force

      - name: Start neon-http-proxy (background)
        run: bun scripts/dev/neon-http-proxy.ts &

      - name: Wait for neon-http-proxy
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:4444/sql -X POST -H 'Content-Type: application/json' \
              -d '{"query":"SELECT 1"}' && break
            sleep 1
          done

      - name: Build the app
        run: bun run build

      - name: Start preview server (background)
        run: |
          node .output/server/index.mjs > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
        env:
          PORT: 3000
          HOST: 0.0.0.0

      - name: Wait for preview server
        run: |
          for i in $(seq 1 30); do
            if ! kill -0 $(cat /tmp/preview.pid) 2>/dev/null; then
              echo "Server process died. Logs:"
              cat /tmp/preview.log
              exit 1
            fi
            curl -sf http://localhost:3000/ > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Server never became ready. Logs:"
          cat /tmp/preview.log
          exit 1

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Install Playwright system dependencies
        run: bunx playwright install-deps chromium

      - name: Generate BDD test files
        run: bunx bddgen

      - name: Run BDD E2E tests (${{ inputs.grep || 'full suite' }})
        env:
          GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$GREP" ]; then
            bunx playwright test --grep "$GREP"
          else
            bunx playwright test
          fi

      # Design-system guardrails (docs/design-system.md → Guardrails): component
      # contract on every page + a11y on the static /docs/design pages. Product-route
      # a11y and visual regression stay local — they depend on DB content / OS fonts.
      - name: Design-system contract + a11y
        # Block scalar: the ": " inside the grep pattern made the whole workflow
        # invalid YAML when written inline (CI silently didn't run 2026-10-10..12).
        run: |
          bunx playwright test -c playwright.design.config.ts contract a11y --grep "component contract|: /docs/design"

      - name: Push E2E results to Grafana Loki
        if: always()
        run: |
          bun scripts/ci/loki-test-results.ts --suite ${{ inputs.suite }} --file test-results/${{ inputs.suite }}.json
          bun scripts/ci/loki-test-results.ts --suite playwright-design --file test-results/playwright-design.json
        env:
          LOKI_URL: ${{ secrets.LOKI_URL }}
          LOKI_USER: ${{ secrets.LOKI_USER }}
          LOKI_TOKEN: ${{ secrets.LOKI_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ inputs.suite }}
          path: playwright-report/
          retention-days: 14

      - name: Upload E2E screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ inputs.suite }}
          path: e2e/test-results/
          retention-days: 14
